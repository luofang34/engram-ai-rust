[package]
name = "engramai"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Neuroscience-grounded memory system for AI agents. ACT-R activation, Hebbian learning, Ebbinghaus forgetting, cognitive consolidation."
authors = ["Toni Tang <tonitangpotato@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/luofang34/engram-ai-rust"
keywords = ["ai", "memory", "cognitive-science", "agent", "neuroscience"]
categories = ["science", "database", "algorithms"]

[features]
default = []
wasm = ["getrandom/js", "chrono/wasmbind", "uuid/js"]
postgres = ["sqlx/runtime-tokio", "sqlx/postgres", "tokio", "async-trait"]

[dependencies]

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"

# Random for interleaved replay
rand = "0.8"

# WASM support
getrandom = { version = "0.2", optional = true }

# SQLx backends (optional)
sqlx = { version = "0.8", features = ["chrono", "uuid", "json"], optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
async-trait = { version = "0.1", optional = true }


[dev-dependencies]
env_logger = "0.11"
tempfile = "3.13"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[lib]
name = "engramai"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
